name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Версии инструментов
        run: |
          echo "Xcode: $(xcodebuild -version | head -1)"
          echo "путь:  $(xcode-select -p)"

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          echo "XcodeGen: $(xcodegen --version)"

      - name: Generate Xcode project
        working-directory: ios
        run: |
          xcodegen generate
          echo "формат проекта (objectVersion):"
          grep -m1 objectVersion ClearReposts.xcodeproj/project.pbxproj

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project ClearReposts.xcodeproj \
            -scheme ClearReposts \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO 2>&1 | tee build.log

      # Вывод xcodebuild огромен; при падении печатаем только ошибки,
      # чтобы их можно было скопировать из хвоста лога.
      - name: Только ошибки
        if: failure()
        working-directory: ios
        run: |
          echo "=============== ОШИБКИ КОМПИЛЯЦИИ ==============="
          grep -E "error:" build.log | sort -u | head -60 || true
          echo "================================================="

      - name: Полный лог артефактом
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build.log

      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ClearReposts.app Payload/
          zip -qr ClearReposts.ipa Payload
          ls -lh ClearReposts.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ClearReposts-ipa
          path: ios/ClearReposts.ipa

  # Сборка под SDK симулятора — её принимает Appetize.io.
  # Это отдельный артефакт: .ipa для устройства симулятор запустить не может.
  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build для симулятора
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild             -project ClearReposts.xcodeproj             -scheme ClearReposts             -configuration Release             -sdk iphonesimulator             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             ONLY_ACTIVE_ARCH=NO 2>&1 | tee sim.log

      - name: Только ошибки
        if: failure()
        working-directory: ios
        run: |
          echo "=============== ОШИБКИ КОМПИЛЯЦИИ ==============="
          grep -E "error:" sim.log | sort -u | head -60 || true
          echo "================================================="

      - name: Упаковать .app
        working-directory: ios/build/Build/Products/Release-iphonesimulator
        run: |
          ls -la
          zip -qr ClearReposts-sim.zip ClearReposts.app
          echo "архитектуры внутри:"
          lipo -info ClearReposts.app/ClearReposts || true
          ls -lh ClearReposts-sim.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ClearReposts-simulator
          path: ios/build/Build/Products/Release-iphonesimulator/ClearReposts-sim.zip

